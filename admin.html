<!-- login -->
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">KAFE<small>COLEÇÃO</small></div>
    <h1>Painel da loja</h1>
    <p class="sub">Acesso restrito à administração</p>
    <div class="field"><label for="le">E-mail</label><input class="inp" id="le" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lp">Senha</label><input class="inp" id="lp" type="password" autocomplete="current-password" required></div>
    <button class="btn pri block" id="lbtn" type="submit">Entrar</button>
    <p id="lerr" class="neg" style="text-align:center;font-size:.8rem;margin-top:.9rem" hidden></p>
  </form>
</div>

<!-- app -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand">KAFE<small>PAINEL</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <a href="index.html" target="_blank" rel="noopener"><svg class="i"><use href="#i-store"/></svg>Ver loja</a>
      <button id="logout"><svg class="i"><use href="#i-out"/></svg>Sair</button>
      <div class="me"><div class="av" id="av">A</div><span id="who"></span></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
      <div class="acts" id="acts"></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" hidden></nav>

<!-- camadas -->
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="ov top2" id="ov2"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
